<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e1814" />
      <stop offset="100%" stopColor="#0d0907" />
    </linearGradient>
    <linearGradient id="leatherFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8d4b24" />
      <stop offset="50%" stopColor="#532912" />
      <stop offset="100%" stopColor="#301507" />
    </linearGradient>
    <linearGradient id="goldFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fff2be" />
      <stop offset="50%" stopColor="#d4af37" />
      <stop offset="100%" stopColor="#967425" />
    </linearGradient>
    <filter id="shadowFav" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#000000" floodOpacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Squircle Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#3a2a1d" stroke-width="2" />

  <!-- Stacked Pages Base -->
  <path
    d="M48 90H98C101 90 104 92 104 95C104 98 101 100 98 100H50C47 100 45 98 45 95C45 92 47 90 48 90Z"
    fill="#f4edde"
    stroke="#2b1408"
    stroke-width="1.5"
  />
  <path d="M50 94H96" stroke="rgba(43, 20, 8, 0.3)" stroke-width="1" />
  <path d="M50 97H96" stroke="rgba(43, 20, 8, 0.3)" stroke-width="1" />

  <!-- Ribbon Bookmark -->
  <path
    d="M54 90V108L59 103L64 108V90H54Z"
    fill="#8b2500"
    filter="url(#shadowFav)"
  />

  <!-- Leather Journal Cover -->
  <rect
    x="58"
    y="22"
    width="44"
    height="68"
    rx="8"
    fill="url(#leatherFav)"
    stroke="#d4af37"
    stroke-width="1.2"
    filter="url(#shadowFav)"
  />

  <!-- Perimeter Stitching -->
  <rect
    x="60.5"
    y="24.5"
    width="39"
    height="63"
    rx="6"
    fill="none"
    stroke="rgba(240, 223, 168, 0.45)"
    stroke-width="0.9"
    stroke-dasharray="2.5 2.5"
  />

  <!-- Brass Clasp Strap -->
  <path
    d="M90 47H106C108.5 47 110.5 49 110.5 51.5C110.5 54 108.5 56 106 56H90V47Z"
    fill="url(#leatherFav)"
    stroke="#d4af37"
    stroke-width="1.2"
  />
  <!-- Clasp Rivet -->
  <circle cx="102" cy="51.5" r="3" fill="url(#goldFav)" stroke="#301507" stroke-width="0.5" />

  <!-- Intertwined Serif Letter 'L' -->
  <path
    d="M32 22H54V28H46V82C46 84.5 48.5 87 53 87H84C89 87 92.5 83 94 78L96.5 80.5C94 88 86.5 92 78 92H40C33.5 92 30 87 30 80V28H22V22H32Z"
    fill="#ffffff"
    stroke="url(#goldFav)"
    stroke-width="1.5"
    filter="url(#shadowFav)"
  />
</svg>
